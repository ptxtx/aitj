server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: aigc-service
  main:
    allow-circular-references: true # 允许循环引用
  ai:
    mcp:
      client:
        # 与业务层开关共用同一环境变量；默认关闭时不建立远程连接。
        enabled: ${TJ_AI_MCP_ENABLED:false}
        name: tianji-aigc
        version: 1.0.0
        initialized: true
        type: SYNC
        request-timeout: 10s
        toolcallback:
          enabled: true
        sse:
          connections:
            tianji-learning:
              url: ${TJ_MCP_SERVER_URL:http://127.0.0.1:8095}
              sse-endpoint: /sse
tj:
  swagger:
    enable: true
    package-path: com.tianji.aigc.controller
    title: 天机学堂 - AIGC接口文档
    description: 该服务包含AI相关功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhangzhijun@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
  jdbc:
    database: tj_aigc #指定使用的数据库名
  ai:
    mcp:
      enabled: ${TJ_AI_MCP_ENABLED:false}
      # true: MCP 已启用但连接或白名单配置错误时快速失败；false: 降级为无 MCP 工具
      fail-fast: true
      # 填写 Spring AI 最终暴露的工具名（1.0.x 通常带 MCP client 名前缀）。
      # 未列出的工具不会提供给模型。
      agent-tools:
        ROUTE: [ ]
        RECOMMEND: [ ]
        BUY: [ ]
        CONSULT: [ ]
        # Spring AI 会用 MCP Client 名作为前缀：tianji-aigc -> tianji_aigc。
        KNOWLEDGE:
          - tianji_aigc_buildLearningPlan
          - tianji_aigc_calculateLearningProgress
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt
        buy-agent:
          data-id: buy-agent-system-message.txt
        consult-agent:
          data-id: consult-agent-system-message.txt
        knowledge-agent:
          data-id: knowledge-agent-system-message.txt
        text:
          data-id: text-system-chat-message.txt
    chat-type: ENHANCE
    memory:
      max: 100 #存储最大的聊天记录数
      type: redis
